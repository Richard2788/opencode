# Snuffly's Carnival — deploy no Render.com (via GitHub)
services:
  - type: web
    name: snufflys-carnival
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    preDeployCommand: npm run db:init -- --seed
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snuffly-db
          property: connectionString
      - key: NODE_VERSION
        value: 20
      # Painel admin e notificações (segredos pedidos no painel do Render)
      - key: ADMIN_PASS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false

databases:
  - name: snuffly-db
    plan: free
    databaseName: snuffly
    user: snuffly
