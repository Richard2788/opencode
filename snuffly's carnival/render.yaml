# Snuffly's Carnival — deploy no Render.com (via GitHub)
services:
  - type: web
    name: snufflys-carnival
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snuffly-db
          property: connectionString

databases:
  - name: snuffly-db
    plan: free
    databaseName: snuffly
    user: snuffly
