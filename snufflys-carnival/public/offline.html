<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e53935" />
  <title>Offline — Snuffly's Carnival</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <img src="/icons/icon-192.png" alt="Logo Snuffly's Carnival" class="brand-logo" />
      <span class="brand-name">Snuffly's <b>Carnival</b></span>
    </a>
  </header>

  <main>
    <section class="hero hero-sm offline-hero">
      <div class="offline-emoji" aria-hidden="true">🎪📡</div>
      <h1>Você está sem conexão</h1>
      <p class="lead">A folia precisa da internet para carregar os prêmios e as novidades.<br />
      Assim que a conexão voltar, tente novamente.</p>
      <div class="hero-actions">
        <button class="btn btn-yellow" onclick="location.reload()">🔄 Tentar novamente</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <img src="/icons/icon-192.png" alt="" class="footer-logo" />
    <p><strong>Snuffly's Carnival</strong> — jogos de carnaval, prêmios geek de papel e papelão.</p>
  </footer>
</body>
</html>
